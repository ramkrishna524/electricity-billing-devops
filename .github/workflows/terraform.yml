name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - "*.tf"
      - ".github/workflows/terraform.yml"

  pull_request:
    branches:
      - main
    paths:
      - "*.tf"
      - ".github/workflows/terraform.yml"

jobs:
  terraform:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::441356678868:role/GitHubActions-ElectricityBilling-ECR
          aws-region: ap-south-1

      - name: Terraform Init
        working-directory: .
        run: terraform init

      - name: Terraform Format Check
        working-directory: .
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: .
        run: terraform validate

      - name: Terraform Plan
        working-directory: .
        run: terraform plan
