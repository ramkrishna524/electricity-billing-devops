name: Electricity Billing CI

on:

  push:

    branches:

      - main

  pull_request:

    branches:

      - main

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    services:

      mysql:

        image: mysql:8.0

        env:

          MYSQL_DATABASE: electricity_billing

          MYSQL_ROOT_PASSWORD: root

        ports:

          - 3306:3306

          options: >-

            --health-cmd="mysqladmin ping -h localhost -uroot -proot"

            --health-interval=10s

            --health-timeout=5s

            --health-retries=10

            --health-start-period=30s

    permissions:

      contents: read

      id-token: write

    steps:

      - name: Checkout code

        uses: actions/checkout@v4

      - name: Set up Java 17

        uses: actions/setup-java@v4

        with:

          java-version: "17"

          distribution: "temurin"

          cache: "maven"

      - name: Build and Test

        run: ./mvnw clean verify

        env:

          DB_HOST: localhost

          DB_PORT: 3306

          DB_NAME: electricity_billing

          DB_USER: root

          DB_PASSWORD: root

      - name: Configure AWS credentials

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        uses: aws-actions/configure-aws-credentials@v4

        with:

          role-to-assume: arn:aws:iam::441356678868:role/GitHubActions-ElectricityBilling-ECR

          aws-region: ap-south-1

      - name: Login to Amazon ECR

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        env:

          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

          ECR_REPOSITORY: electricity-billing

          IMAGE_TAG: ${{ github.sha }}

        run: |

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG